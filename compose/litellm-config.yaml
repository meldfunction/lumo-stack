# LiteLLM for the Lumo stack (Compose): routes only to lumo-bridge, reached as bridge:3004.
model_list:
  - model_name: lumo
    litellm_params:
      model: openai/lumo
      api_base: http://bridge:3004/v1
      api_key: "{{TAMER_KEY}}"
  - model_name: lumo-max
    litellm_params:
      model: openai/lumo-max
      api_base: http://bridge:3004/v1
      api_key: "{{TAMER_KEY}}"
  - model_name: lumo-lite
    litellm_params:
      model: openai/lumo-lite
      api_base: http://bridge:3004/v1
      api_key: "{{TAMER_KEY}}"

litellm_settings:
  drop_params: true
  # Lumo router (templates/lumo_router.py): Lumo only for short Q&A; agent, tool and long work to
  # Cloudflare when it's on; never more than 60 Lumo messages a week. Remove the line to turn it off.
  callbacks: ["lumo_router.router"]

general_settings:
  master_key: "{{LITELLM_KEY}}"
